<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <meta name="author" content="Lianrui Geng">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body class="{{ page.body_class }}">
  <header class="topbar">
    <a class="topbar-name" href="/">Lianrui Geng</a>
    <nav aria-label="Site">
      <a href="/#publications">Publications</a>
      <a href="/#projects">Projects</a>
      <a href="/cv/">CV</a>
    </nav>
  </header>
  <main>
{{ content }}
  </main>
  <footer class="site-foot">&copy; {{ site.time | date: '%Y' }} Lianrui Geng</footer>
</body>
</html>
